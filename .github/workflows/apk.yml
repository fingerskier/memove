# Builds a release APK on GitHub's runners (the dev box is too small for Gradle).
# Pushes to main, pull requests and manual runs upload the APK as a workflow
# artifact; a CalVer tag (vYYYY.M.D, no zero padding, e.g. v2026.10.9) also
# attaches it to a GitHub release. A tag containing '-' (v2026.10.9-rc1) is
# published as a prerelease. iOS and web are supported in the codebase but not
# built here (docs/decisions/0001-flutter-over-pwa.md).
#
# Optional signing secrets (without them the APK is signed with a debug key):
#   ANDROID_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; the APK will be signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/memove-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: memove-apk
          path: flutter/build/memove-*.apk
          if-no-files-found: error

      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/memove-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
